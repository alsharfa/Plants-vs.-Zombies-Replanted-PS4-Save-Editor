name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build no-console EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "PVZ_Replanted_CUSA55613_Save_Editor_v2.6" `
            --add-data "assets;assets" `
            "PVZ_Replanted_CUSA55613_Save_Editor.pyw"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PVZ-Replanted-PS4-Save-Editor-v2.6-Windows
          path: dist/PVZ_Replanted_CUSA55613_Save_Editor_v2.6.exe
